# tbfirst 迷你主机 · 前端 Nginx 配置
# 职责:
#   1. 托管 SPA(tbfirst-frontend/dist)
#   2. 反代 /api、/static、/img 到 gateway:8000(同 docker network)
#   3. SPA 路由 fallback(/login、/admin/* 等都返回 index.html)
#   4. 静态资源强缓存(文件名带 hash,缓存 1 年安全)

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 客户端 body 上限:前端图片走 base64 上传时可能较大(参考图最大 10MB)
    client_max_body_size 32m;

    # gzip 压缩前端 JS/CSS,降低出口带宽
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # ----------------------------------------------------------------
    # API / 静态资源反代:Spring Cloud Gateway
    # ----------------------------------------------------------------
    location ~ ^/(api|static|img)/ {
        proxy_pass http://gateway:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 生图长耗时接口：gateway response-timeout=620s，但 Cloudflare Tunnel 免费套餐
        # 强制 100s 切断（HTTP 524）。nginx 侧保留 200s 作为 gateway 内部流量兜底；
        # 面向外网的真正约束是 CF 的 100s，需在 Python 侧控制单次生成 < 90s。
        proxy_connect_timeout 10s;
        proxy_send_timeout    200s;
        proxy_read_timeout    200s;

        # 长响应不缓冲,避免 OOM + 增加 TTFB
        proxy_buffering off;
    }

    # ----------------------------------------------------------------
    # Spring Boot Actuator 健康检查(可选,运维用)
    # ----------------------------------------------------------------
    location /actuator/ {
        proxy_pass http://gateway:8000;
        proxy_set_header Host $host;
    }

    # ----------------------------------------------------------------
    # SPA 静态资源:强缓存(Vite 产物文件名带 hash,改文件名 = 缓存自动失效)
    # ----------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ----------------------------------------------------------------
    # SPA fallback:所有未匹配路径(/login、/admin/*、/profile 等)都返回 index.html
    # 这是 React Router 7 + 浏览器直接访问深链能正常工作的关键
    # ----------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 关掉服务器版本号外泄(轻微安全收敛)
    server_tokens off;
}